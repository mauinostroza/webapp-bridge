name: Build SAP2000 Bridge

# Compila el puente de SAP2000 (SAP2000Bridge.exe, un único archivo con icono en la bandeja)
# y lo empaqueta en SAP2000Bridge.zip. Solo manual: pestaña Actions, botón "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Construir SAP2000Bridge.zip
        shell: pwsh
        env:
          # Secreto del repositorio (Settings > Secrets and variables > Actions > Secrets): GitHub lo
          # enmascara en los registros, que en un repositorio público son visibles para todos.
          ORIGENES_ALOJADOS: ${{ secrets.ORIGENES_ALOJADOS }}
        run: .\scripts\build_bridge.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SAP2000Bridge
          path: SAP2000Bridge.zip
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS-bridge
          path: SHA256SUMS.txt
          retention-days: 7
